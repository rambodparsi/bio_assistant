# =====================================================================
# Bio Assistant settings.
# Replace every value in [SQUARE BRACKETS] with your own text.
# (The setup check refuses to run while any [ ... ] placeholder is left.)
# This file is committed to the PUBLIC GitHub repo, so put nothing secret here.
# =====================================================================

# ---------- About you ----------
owner_full_name: "Rambod"            # e.g. "Jane Doe"
owner_first_name: "Rambod"          # e.g. "Jane" - used as "Jane has worked on..."
owner_title_or_field: "Researcher/AI-assisted Software Engineering"  # e.g. "PhD researcher in computational biology"

# ---------- The chat window ----------
# Header at the top of the chat: icon on the left, title (bold) and description beside it.
# The title is also the browser tab title. Leave the description "" to hide it.
assistant_name: "Hi, my name is Dana."
assistant_icon: "assets/dana.png"   # square image (PNG/JPG); shown as a circle. "" = no icon
assistant_description: "I'm an AI assistant to answer your questions on Rambod's background. Feel free to ask about his research, professional experience, or hobbies!"

# First message visitors see. Markdown is allowed. Turned off ("") - to show it again, use e.g.:
#   "Welcome! I am Rambod's website AI assistant.\n\nI am here to answer your questions about his work, research, background, or personal interests. Feel free to ask whatever you would like to know!"
welcome_message: ""

# Clickable example questions shown in the chat box. Turned off ([]) - to show them again, use e.g.:
#   - "What is Rambod's educational background?"
#   - "What are Rambod's main research topics?"
#   - "What is Rambod working on now?"
#   - "What are Rambod's personal interests?"
example_questions: []

# Reply used when no document matches the question well enough
# (the model is not even called in that case). {owner_first_name} is filled in automatically.
no_answer_message: "I'm sorry, I don't have access to that information. This assistant is intended only to answer questions about {owner_first_name}'s background and work."

# ---------- Google Gemini models ----------
# Checked against the google-genai SDK (v2.33.0) and Google's model listings, Oct 2026.
# If Google retires a model, change the name here - no code changes needed.
chat_model: "gemini-3.5-flash-lite"   # cheap + fast; e.g. "gemini-3.8-flash" for higher quality
embedding_model: "gemini-embedding-2"
embedding_dimensions: 768     # smaller = smaller index; 768 is plenty for a personal site
use_task_types: true          # use RETRIEVAL_DOCUMENT / RETRIEVAL_QUERY embedding task types

# ---------- Private Hugging Face Dataset ----------
# Where your documents and index are stored (PRIVATE). Format: username/dataset-name
hf_dataset_repo: "Rambodparsi/bio-assistant-data"   # e.g. "Rambodparsi/bio-assistant-data"

# ---------- Retrieval & answering ----------
chunk_size: 1200            # max characters per chunk (~200 words)
chunk_overlap: 200          # characters repeated between neighbouring chunks
top_k: 6                    # how many chunks to send to the model per question
similarity_threshold: 0.45  # 0-1; chunks scoring below this are ignored. Raise = stricter.
temperature: 0.2            # low = factual and consistent
max_history_turns: 3        # how many previous question/answer pairs the model sees
show_sources: false         # true = show a small "Sources: ..." line under each answer
